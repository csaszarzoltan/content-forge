[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contentforge"
version = "0.10.0"
description = "AI-powered content platform with brand voice customization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "fast-langdetect>=1.0",
    "sacrebleu>=1.0",
    "scipy>=1.14.0",
    "textstat>=0.7,<0.7.13",
    "httpx>=0.27.0",
    "cryptography>=3.5.0",
    "bcrypt>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5",
    "pytest-testmon>=1.4",
    "ruff>=0.1.0",
]
openai = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "quick: fast unit tests (< 1s each) - run with 'pytest -m quick'",
    "integration: integration tests (may need external services)",
    "slow: slow tests (> 5s each) - skipped in quick suite",
]
addopts = "-n auto -q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"*" = ["static/*.css"]
