[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contentforge"
version = "0.16.0"
description = "AI-powered content platform with brand voice customization"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "uvicorn==0.52.0",
    "sqlalchemy[asyncio]==2.0.51",
    "aiosqlite==0.22.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "fast-langdetect==1.0.1",
    "sacrebleu==2.6.0",
    "scipy==1.17.1; python_version < \"3.12\"",
    "scipy==1.18.0; python_version >= \"3.12\"",
    "textstat==0.7.12",
    "httpx==0.28.1",
    "cryptography==50.0.0",
    "bcrypt==4.0.1",
    # Video pipeline (P0-5 render): MoviePy 2.x + imageio-ffmpeg bundle a
    # static ffmpeg binary — no system ffmpeg needed (verified absent on host).
    "moviepy>=2.0,<3",
    "imageio-ffmpeg>=0.5,<1",
    "numpy>=2.0,<3",
    "pillow>=11.0,<13",
    "typer>=0.12,<1",
]

[project.scripts]
contentforge = "src.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-testmon==2.2.0",
    "ruff==0.16.1",
]
openai = [
    "openai==2.50.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "quick: fast unit tests (< 1s each) - run with 'pytest -m quick'",
    "integration: integration tests (may need external services)",
    "slow: slow tests (> 5s each) - skipped in quick suite",
]
addopts = "-n auto -q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
extend-ignore = ["B008", "B017", "S110", "S112", "EXE001", "RUF100", "BLE001", "DTZ001", "DTZ005"]

[tool.setuptools.package-data]
"*" = ["static/*.css"]
